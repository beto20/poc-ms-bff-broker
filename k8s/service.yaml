apiVersion: v1
kind: Service
metadata:
  name: bff-broker
  labels:
    app: bff-broker
spec:
  # Public-facing BFF. Switch to LoadBalancer (or front with an Ingress)
  # to expose it outside the cluster.
  type: ClusterIP
  selector:
    app: bff-broker
  ports:
    - name: http
      port: 8080
      targetPort: http
