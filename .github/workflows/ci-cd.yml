name: bff-broker CI/CD

# Solo se ejecuta de forma manual desde la pestana Actions.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Desplegar a EKS despues de construir la imagen"
        type: boolean
        default: true

# Cancela ejecuciones antiguas de la misma rama.
concurrency:
  group: bff-broker-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE: bff-broker

jobs:
  # ---------------------------------------------------------------------------
  # 1) Compilacion y pruebas
  # ---------------------------------------------------------------------------
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build & test
        run: ./mvnw -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bff-broker-surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2) Construccion y publicacion de la imagen en GHCR
  # ---------------------------------------------------------------------------
  docker:
    name: Build & Push image
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.ref }}
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image ref (GHCR exige minusculas)
        id: img
        run: echo "ref=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/bff-broker" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:${{ github.sha }}
            ${{ steps.img.outputs.ref }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 3) Despliegue a Kubernetes
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: docker
    if: inputs.deploy
    environment: production
    permissions:
      contents: read
      id-token: write # necesario para asumir el rol de AWS via OIDC
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - name: Apply manifests & roll out
        env:
          IMAGE: ${{ needs.docker.outputs.image }}
          TAG: ${{ needs.docker.outputs.tag }}
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/bff-broker bff-broker="${IMAGE}:${TAG}"
          kubectl rollout status deployment/bff-broker --timeout=120s
